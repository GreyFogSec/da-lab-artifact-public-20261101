name: raw-production

on:
  pull_request:

permissions:
  contents: read

jobs:
  produce-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Create bounded raw files
        run: |
          node <<'NODE'
          const fs = require('fs')
          fs.mkdirSync('raw', {recursive: true})
          fs.writeFileSync('raw/ordinary.bin', Buffer.from('ordinary-raw-production\n'))
          fs.writeFileSync('raw/.hidden', Buffer.from('hidden-raw-production\n'))
          fs.writeFileSync('raw/Case.bin', Buffer.alloc(262144, 0x41))
          fs.writeFileSync('raw/case.bin', Buffer.alloc(262144, 0x62))
          NODE

      - name: Upload ordinary raw file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: raw/ordinary.bin
          archive: false
          retention-days: 1

      - name: Upload hidden raw file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: raw/.hidden
          archive: false
          include-hidden-files: true
          retention-days: 1

      - name: Upload upper-case raw file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: raw/Case.bin
          archive: false
          retention-days: 1

      - name: Upload lower-case raw file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: raw/case.bin
          archive: false
          retention-days: 1

  consume-raw:
    needs: produce-raw
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - name: Seed existing ordinary destination
        shell: bash
        run: |
          mkdir -p ordinary-out
          printf 'preexisting-content\n' > ordinary-out/ordinary.bin

      - name: Download ordinary raw file with automatic representation detection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ordinary.bin
          path: ordinary-out

      - name: Download hidden raw file by exact name
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: .hidden
          path: hidden-out

      - name: Download case variants into a merged directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '*ase.bin'
          merge-multiple: true
          path: case-out

      - name: Inventory raw outputs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const crypto = require('crypto')
          const hash = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')
          const inventory = dir => fs.existsSync(dir) ? fs.readdirSync(dir).sort().map(name => {
            const p = path.join(dir, name)
            return {name, size: fs.statSync(p).size, sha256: hash(p)}
          }) : []
          const result = {
            platform: process.platform,
            ordinary: inventory('ordinary-out'),
            hidden: inventory('hidden-out'),
            caseOutputs: inventory('case-out')
          }
          fs.mkdirSync('evidence', {recursive: true})
          fs.writeFileSync('evidence/raw-outcomes.json', JSON.stringify(result, null, 2) + '\n')
          NODE

      - name: Upload sanitized raw outcomes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: raw-outcomes-${{ runner.os }}
          path: evidence/raw-outcomes.json
          retention-days: 7

  raw-symlink-boundary:
    needs: produce-raw
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed a pre-existing destination symlink
        run: |
          mkdir -p symlink-out evidence
          printf 'protected-before\n' > outside.txt
          ln -s ../outside.txt symlink-out/ordinary.bin

      - name: Download supported raw artifact through the symlink
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ordinary.bin
          path: symlink-out

      - name: Record sanitized symlink outcome
        run: |
          jq -n \
            --arg outsideHash "$(sha256sum outside.txt | cut -d' ' -f1)" \
            --arg linkTarget "$(readlink symlink-out/ordinary.bin)" \
            --arg artifactHash "$(printf 'ordinary-raw-production\n' | sha256sum | cut -d' ' -f1)" \
            '{platform:"linux",outsideHash:$outsideHash,artifactHash:$artifactHash,linkTarget:$linkTarget,outsideEqualsArtifact:($outsideHash == $artifactHash)}' \
            > evidence/symlink-outcome.json

      - name: Upload sanitized symlink outcome
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: raw-symlink-outcome
          path: evidence/symlink-outcome.json
          retention-days: 7
