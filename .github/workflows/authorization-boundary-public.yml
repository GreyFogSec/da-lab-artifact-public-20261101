name: authorization-boundary-public

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  public-token-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create bounded public control artifact
        run: |
          mkdir -p payload
          printf 'public-lab-artifact run=%s\n' "$GITHUB_RUN_ID" > payload/canary.txt

      - name: Upload public control artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-authz-canary-${{ github.run_id }}
          path: payload/canary.txt
          retention-days: 1

      - name: Positive control - same-run public artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: public-authz-canary-${{ github.run_id }}
          path: same-run

      - name: Negative control - public token downloads private artifact
        id: cross_private
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: private-canary-41330260349
          path: cross-private
          repository: GreyFogSec/da-lab-artifact-private-20261101
          run-id: '41330260349'
          github-token: ${{ github.token }}

      - name: Probe private REST boundary without retaining response bodies
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_RUN: '41330260349'
          PRIVATE_ARTIFACT: '13092109798'
        run: |
          list_code=$(curl -sS -o list.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/GreyFogSec/da-lab-artifact-private-20261101/actions/runs/$PRIVATE_RUN/artifacts")
          download_code=$(curl -sS -o download.bin -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/GreyFogSec/da-lab-artifact-private-20261101/actions/artifacts/$PRIVATE_ARTIFACT/zip")
          write_code=$(curl -sS -o write.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/heads/unauthorized-authz-$GITHUB_RUN_ID\",\"sha\":\"$GITHUB_SHA\"}")
          printf 'list_code=%s\ndownload_code=%s\nwrite_code=%s\n' "$list_code" "$download_code" "$write_code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$(jq -r '.message // ""' list.json)" > list-message.txt
          printf '%s\n' "$(jq -r '.message // ""' download.bin 2>/dev/null || true)" > download-message.txt
          printf '%s\n' "$(jq -r '.message // ""' write.json)" > write-message.txt
          rm -f download.bin

      - name: Build sanitized evidence
        env:
          CROSS_PRIVATE: ${{ steps.cross_private.outcome }}
          LIST_CODE: ${{ steps.api.outputs.list_code }}
          DOWNLOAD_CODE: ${{ steps.api.outputs.download_code }}
          WRITE_CODE: ${{ steps.api.outputs.write_code }}
        run: |
          mkdir -p evidence
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg actor "$GITHUB_ACTOR" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg headRepository "${{ github.event.pull_request.head.repo.full_name }}" \
            --arg headSha "${{ github.event.pull_request.head.sha }}" \
            --arg crossPrivate "$CROSS_PRIVATE" \
            --arg listCode "$LIST_CODE" \
            --arg downloadCode "$DOWNLOAD_CODE" \
            --arg writeCode "$WRITE_CODE" \
            --arg sameRunHash "$(sha256sum same-run/canary.txt | cut -d' ' -f1)" \
            --arg listMessage "$(cat list-message.txt)" \
            --arg downloadMessage "$(cat download-message.txt)" \
            --arg writeMessage "$(cat write-message.txt)" \
            '{runId:$runId,actor:$actor,event:$event,headRepository:$headRepository,headSha:$headSha,permissions:{actions:"read",contents:"read"},sameRun:{sha256:$sameRunHash},crossPrivate:{actionOutcome:$crossPrivate,listStatus:$listCode,listMessage:$listMessage,downloadStatus:$downloadCode,downloadMessage:$downloadMessage},contentsWrite:{status:$writeCode,message:$writeMessage}}' \
            > evidence/authorization.json

      - name: Upload sanitized authorization evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-authorization-evidence-${{ github.run_id }}
          path: evidence/authorization.json
          retention-days: 7
